[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA: let React Router handle /video/:animalId on refresh / direct links
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed JS/CSS never change — cache forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Photos and sounds — cache for a week
[[headers]]
  for = "/animals/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/sounds/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# PWA: the service worker must always be re-checked, or updates get stuck
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"
